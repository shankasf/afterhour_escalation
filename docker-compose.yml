version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: escalation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escalation_password}
      POSTGRES_DB: ${POSTGRES_DB:-escalation}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for job queue (using external Supabase PostgreSQL)
  redis:
    image: redis:7-alpine
    container_name: escalation-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NestJS Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: escalation-backend
    environment:
      # Using Supabase pooler (IPv4) 
      DATABASE_URL: postgresql://postgres.ysphdgphpqwrmjywzyju:0GhQjMHAtlBAbkHf@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-afterhours-jwt-secret-key-change-in-production}
      AI_SERVICE_URL: http://ai-service:8083
      NODE_ENV: production
      PORT: 3004
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL}
      # Email (Gmail)
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      # Internal API key for service-to-service auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-service-key}
    ports:
      - "3004:3004"
    volumes:
      - backend_logs:/app/logs
      - ./backend/prisma:/app/prisma
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # FastAPI AI Service
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: escalation-ai-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EMERGENCY_THRESHOLD: ${EMERGENCY_THRESHOLD:-80}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL}
      # Dialpad (optional)
      DIALPAD_API_KEY: ${DIALPAD_API_KEY:-}
      DIALPAD_WEBHOOK_SECRET: ${DIALPAD_WEBHOOK_SECRET:-}
      # Email (Gmail IMAP/SMTP)
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_ENCRYPTION: ${IMAP_ENCRYPTION:-SSL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-STARTTLS}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-After-Hours Escalation System}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Backend callback
      BACKEND_URL: http://backend:3004
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      # Internal API key for service-to-service auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-service-key}
    ports:
      - "8083:8083"
    volumes:
      - ai_service_logs:/app/logs
    restart: unless-stopped

  # React Frontend (nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: escalation-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  ai_service_logs:
    driver: local

networks:
  default:
    name: escalation-network
