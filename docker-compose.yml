services:
  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: escalation-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NestJS Backend (dev mode)
  backend:
    image: node:20-slim
    container_name: escalation-backend
    working_dir: /app
    network_mode: host
    environment:
      # Database connection (Supabase PostgreSQL)
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ${JWT_SECRET:-afterhours-jwt-secret-key-change-in-production}
      AI_SERVICE_URL: http://localhost:8083
      NODE_ENV: production
      PORT: 3004
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL}
      # Email (Gmail)
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      # Internal API key for service-to-service auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-service-key}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    command: ["sh", "-c", "apt-get update && apt-get install -y python3 make g++ openssl && npm install -g pnpm && pnpm install && npm rebuild bcrypt --build-from-source && npx prisma generate && pnpm start:dev"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # FastAPI AI Service
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: escalation-ai-service
    network_mode: host
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Not used yet (reserved for future call-audio generation)
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-gpt-realtime-2025-08-28}
      OPENAI_VOICE_NAME: ${OPENAI_VOICE_NAME:-alloy}
      # Emergency score is 0.0-1.0 in code.
      EMERGENCY_SCORE_THRESHOLD: ${EMERGENCY_SCORE_THRESHOLD:-0.6}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL}
      # Dialpad (optional)
      DIALPAD_API_KEY: ${DIALPAD_API_KEY:-}
      DIALPAD_WEBHOOK_SECRET: ${DIALPAD_WEBHOOK_SECRET:-}
      # Email (Gmail IMAP/SMTP)
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_ENCRYPTION: ${IMAP_ENCRYPTION:-SSL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-STARTTLS}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-After-Hours Escalation System}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Backend callback
      BACKEND_URL: http://localhost:3004
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      # Internal API key for service-to-service auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-service-key}
    volumes:
      - ./ai-service:/app
      - ai_service_logs:/app/logs
      - ai_service_data:/app/data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8083", "--reload"]
    restart: unless-stopped

  # React Frontend (dev mode with Vite)
  frontend:
    image: node:20-slim
    container_name: escalation-frontend
    working_dir: /app
    network_mode: host
    environment:
      - VITE_API_URL=http://localhost:3004
      - PNPM_HOME=/root/.local/share/pnpm
      - CI=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_pnpm_store:/root/.local/share/pnpm/store
    command: ["sh", "-c", "npm install -g pnpm && pnpm config set store-dir /root/.local/share/pnpm/store && pnpm install && pnpm dev --host"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  backend_logs:
    driver: local
  ai_service_logs:
    driver: local
  ai_service_data:
    driver: local
  frontend_pnpm_store:
    driver: local

networks:
  default:
    name: escalation-network
